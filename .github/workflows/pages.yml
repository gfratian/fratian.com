name: Build and deploy (Jekyll + polyglot + Wedding)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Setup Node for Wedding Micro-Site
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "_wedding/package-lock.json"

      - name: Build Wedding Micro-Site
        run: |
          cd _wedding
          npm ci
          OUTPUT_EXPORT=true npm run build
          mkdir -p ../_site/may2027
          cp -r out/* ../_site/may2027/
          cd ..
          mkdir -p ./_site/may28 ./_site/wedding ./_site/rsvp ./_site/admin
          cp may28/index.html ./_site/may28/
          cp wedding/index.html ./_site/wedding/
          cp rsvp/index.html ./_site/rsvp/
          cp admin/index.html ./_site/admin/
          touch ./_site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
