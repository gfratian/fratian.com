title: George Fratian
tagline: Travels, projects and other detours
description: >-
  Travel writing, side projects and assorted curiosities from George Fratian.
url: https://fratian.com
baseurl: ""
lang: en

# Contact form. Messages are relayed to your inbox by Web3Forms; your email
# address is never written into the page, so scrapers can't harvest it.
# Get a key by entering your address at https://web3forms.com — it's emailed
# to you straight away, no account or password. Paste it below and the form
# goes live. Leave it empty and the page shows a placeholder instead.
contact_form_key: "f1a691dc-93f5-4de7-87c3-ac67e392f000"

# Each blog on the site is a collection. Add a new one by copying this
# pattern, creating the matching _<name> folder, and adding a card to
# index.html. Nothing else needs to change.
collections:
  chapters:
    output: true
    label: Roci and I
  moon:
    output: true
    label: Low Cost Moon Landing

defaults:
  - scope: { path: "", type: chapters }
    values: { layout: chapter }
  - scope: { path: "", type: moon }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: page }

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]

sass:
  style: compressed

exclude:
  - tools
  - tests
  - docs
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache

# Built with GitHub Actions (see .github/workflows/pages.yml) so we can use
# jekyll-polyglot for the four-language site.
plugins:
  - jekyll-polyglot

# --- Multilingual (jekyll-polyglot) ---
languages: ["en", "ro", "it", "fr"]
default_lang: "en"
exclude_from_localization: ["assets", "CNAME", ".nojekyll"]
parallel_localization: false
