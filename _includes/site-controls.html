<div class="site-controls">
  <div class="lang-pill" role="group" aria-label="Language">
    <a class="lang is-on" href="#" hreflang="en" lang="en" aria-current="true">EN</a>
    <a class="lang" href="#" hreflang="ro" lang="ro">RO</a>
    <a class="lang" href="#" hreflang="it" lang="it">IT</a>
    <a class="lang" href="#" hreflang="fr" lang="fr">FR</a>
  </div>
  <button id="skin-toggle" type="button" class="skin-toggle"
          aria-label="{{ t.skin.aria }}">
    <span class="skin-seg" data-skin="modern" data-label="{{ t.skin.to_modern }}">{{ t.skin.new }}</span>
    <span class="skin-seg" data-skin="retro">{{ t.skin.old }}</span>
  </button>
</div>
