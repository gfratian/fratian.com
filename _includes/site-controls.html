<div class="site-controls">
  <div class="lang-pill" role="group" aria-label="{{ t.lang_aria }}">
    {% for lang in site.languages %}
      {% if lang == site.default_lang %}{% assign href = page.url %}{% else %}{% assign href = page.url | prepend: lang | prepend: '/' %}{% endif %}
      <a class="lang{% if lang == site.active_lang %} is-on{% endif %}" {% static_href %}href="{{ href }}"{% endstatic_href %} hreflang="{{ lang }}" lang="{{ lang }}"{% if lang == site.active_lang %} aria-current="true"{% endif %}>{{ lang | upcase }}</a>
    {% endfor %}
  </div>
  <button id="skin-toggle" type="button" class="skin-toggle"
          aria-label="{{ t.skin.aria }}">
    <span class="skin-seg" data-skin="modern" data-label="{{ t.skin.to_modern }}">{{ t.skin.new }}</span>
    <span class="skin-seg" data-skin="retro">{{ t.skin.old }}</span>
  </button>
</div>
